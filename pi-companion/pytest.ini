[pytest]
; Not part of the original file-tree sketch, but necessary plumbing: this package isn't
; pip-installed (no setup.py/pyproject build here), so pytest needs to be told where to find
; shot_timer_pi/ for `from shot_timer_pi.x import y` to resolve. Relative to this file, i.e.
; pi-companion/ itself gets added to sys.path.
pythonpath = .
testpaths = tests
